<!DOCTYPE html>
<html>
<head>
    <title>Mental Math</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        h1 {
            font-size: 32px;
        }

        .problem {
            font-size: 40px;
            margin: 30px 0;
        }

        button {
            font-size: 20px;
            padding: 14px 24px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Mental Math</h1>

    <div id="homeScreen">
    	<button onclick="twoByTwo()">2 by 2</button>
		<button onclick="threeByThree()">3 by 3</button>
    </div>
	
	<div id = "typeScreen" hidden>
		<button onclick = "showProblem('subtraction')">subtraction</button>
		<button onclick = "showProblem('factorable')">factorable</button>
		<button onclick = "showProblem('mixed')">mixed</button>
	</div>

    <div id="practiceScreen" hidden>
        <div class="problem" id="problem"></div>
        <button onclick="showAnswer()">Show Answer</button>
    </div>

    <div id="answerScreen" hidden>
        <div class="problem" id="answer"></div>
        <button onclick="goHome()">Home</button>
    </div>

    <script>
        let numberCandidates = [];
        let number1Candidates = [];
		let number1;
		let number2;
		let numberDigits;

        function twoByTwo(){
			numberDigits = 2;

            document.getElementById("homeScreen").hidden = true;
            document.getElementById("typeScreen").hidden = false;
		}

		function threeByThree(){
			numberDigits = 3;

            document.getElementById("homeScreen").hidden = true;
            document.getElementById("typeScreen").hidden = false;
		}

	function showProblem(type){
		numberCandidates = [];
		number1Candidates = [];
			for (let i = Math.pow(10, numberDigits - 1) + 1; i < Math.pow(10, numberDigits); i++){
				if ((i%10) != 0){
					numberCandidates.push(i);
				}
			}
		if (type == 'subtraction'){
			for (let i = 0; i < numberCandidates.length; i++){
				if ((numberCandidates[i])%10 == 9){
					number1Candidates.push(numberCandidates[i]);
				}
			}
		}
		else if (type == 'factorable'){
			for (let i = 0; i < numberCandidates.length; i++){
				for (let factor = 2; factor < 10; factor++){
					if ((numberCandidates[i])%factor == 0){
						number1Candidates.push(numberCandidates[i]);
						break;
					}
				}
			}
		}
		else {
			number1Candidates = numberCandidates;
		}
			
		let number1Index = Math.floor(Math.random()*number1Candidates.length);
		let number2Index = Math.floor(Math.random()*numberCandidates.length);
		number1 = number1Candidates[number1Index];
		number2 = numberCandidates[number2Index];

		document.getElementById("problem").textContent = number1 + " × " + number2;
        document.getElementById("typeScreen").hidden = true;
        document.getElementById("practiceScreen").hidden = false;
	}

        function showAnswer() {
            document.getElementById("answer").textContent =
                number1 + " × " + number2 + " = " + (number1 * number2);

            document.getElementById("practiceScreen").hidden = true;
            document.getElementById("answerScreen").hidden = false;
        }

        function goHome() {
            document.getElementById("answerScreen").hidden = true;
            document.getElementById("homeScreen").hidden = false;
        }
    </script>
</body>
</html>
